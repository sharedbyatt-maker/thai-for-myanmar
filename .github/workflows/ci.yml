name: Flutter verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source, content, and Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Validate content dataset
        run: python3 tool/validate_content.py

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analyze Dart source
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        timeout-minutes: 8
        run: >-
          flutter test
          test/app_state_test.dart
          test/phrase_repository_test.dart
          test/quiz_logic_test.dart
          test/speech_service_test.dart
          --reporter expanded

      - name: Run widget tests
        timeout-minutes: 5
        run: flutter test test/widget_test.dart --reporter expanded

  android:
    name: Build and verify Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java for Android builds
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org=com.sharedbyatt --project-name=thai_for_myanmar

      - name: Apply safe Android defaults
        run: python3 tool/configure_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Free unused runner toolchains for emulator space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Enable Linux hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available; emulator will use software acceleration."
          fi

      - name: Build Android test APK before emulator startup
        run: flutter build apk --debug

      - name: Verify a core flow in an Android emulator
        id: android_core_flow
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          disable-animations: true
          script: flutter test -d emulator-5554 integration_test/app_flow_test.dart --reporter expanded

      - name: Build release-mode Android App Bundle
        run: flutter build appbundle --release

      - name: Keep Android review builds
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Capture Android emulator diagnostics after failure
        if: failure() && steps.android_core_flow.outcome == 'failure'
        timeout-minutes: 2
        run: |
          mkdir -p ci-diagnostics
          timeout 15s adb devices -l > ci-diagnostics/adb-devices.txt 2>&1 || true
          timeout 20s adb -s emulator-5554 logcat -d -t 3000 > ci-diagnostics/android-logcat.txt 2>&1 || true
          free -h > ci-diagnostics/host-memory.txt 2>&1 || true
          df -h / > ci-diagnostics/host-disk.txt 2>&1 || true
          ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | head -20 > ci-diagnostics/host-processes.txt 2>&1 || true

      - name: Keep Android emulator diagnostics
        if: failure() && steps.android_core_flow.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-android-failure-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Build and verify Web Preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform scaffolding
        run: flutter create . --platforms=web --org=com.sharedbyatt --project-name=thai_for_myanmar

      - name: Resolve packages
        run: flutter pub get

      - name: Install ChromeDriver
        run: |
          npx --yes @puppeteer/browsers install chromedriver@stable
          CHROMEDRIVER_BIN="$(find "$GITHUB_WORKSPACE/chromedriver" "$RUNNER_TEMP" "$HOME/.cache/puppeteer" -type f -name chromedriver -perm -u+x -print -quit 2>/dev/null)"
          if [ -z "$CHROMEDRIVER_BIN" ]; then
            echo "ChromeDriver installation did not produce an executable." >&2
            exit 1
          fi
          echo "$(dirname "$CHROMEDRIVER_BIN")" >> "$GITHUB_PATH"

      - name: Start ChromeDriver
        run: |
          chromedriver --port=4444 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chromedriver.log"
          exit 1

      - name: Verify Quick Speak in Chrome
        timeout-minutes: 12
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_flow_test.dart -d chrome --web-browser-flag=--window-size=420,900

      - name: Build release Web Preview
        run: flutter build web --release --base-href /

      - name: Keep verified Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Capture browser diagnostics after failure
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          cp "$RUNNER_TEMP/chromedriver.log" ci-diagnostics/chromedriver.log 2>/dev/null || true

      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-web-failure-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  publish_web_preview:
    name: Publish verified Web Preview bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the Web build from the passing verification job
        uses: actions/download-artifact@v4
        with:
          name: thai-for-myanmar-web-preview
          path: web-bundle

      - name: Publish static bundle to the dedicated preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-preview
          publish_dir: web-bundle
          commit_message: 'chore: publish verified Web Preview'
