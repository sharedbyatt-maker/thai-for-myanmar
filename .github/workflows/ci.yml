name: Flutter verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-audit:
    name: Audit Thai content with PyThaiNLP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements-content.txt
      - run: python -m unittest discover -s tool/tests -p test_content_audit.py -v
      - run: python tool/audit_thai_content.py
      - run: git diff --exit-code -- assets/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thai-content-audit
          path: build/content-audit.json
          if-no-files-found: error
          retention-days: 14
  league-db:
    name: Verify League scoring and privacy in PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tool/league/build_seed.py
      - run: git diff --exit-code -- supabase/migrations/20261030112659_question_catalog.sql
      - run: npm ci --prefix tool/league
      - run: npm test --prefix tool/league
  verify:
    name: Verify source, content, and Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Validate content dataset
        run: python3 tool/validate_content.py

      - name: Validate Thai audio catalog
        run: python3 tool/validate_audio_manifest.py

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analyze Dart source
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        timeout-minutes: 8
        run: >-
          flutter test
          test/app_state_test.dart
          test/phrase_repository_test.dart
          test/quiz_logic_test.dart
          test/speech_service_test.dart
          test/thai_audio_catalog_test.dart
          test/thai_playback_service_test.dart
          test/learner_rank_test.dart
          test/learning_progress_test.dart
          test/study_catalog_test.dart
          test/study_quests_test.dart
          --reporter expanded

      - name: Run widget tests
        timeout-minutes: 5
        run: flutter test test/widget_test.dart test/study_session_test.dart test/league_screen_test.dart test/practical_intro_test.dart --reporter expanded

      - name: Verify Thai playback button states
        timeout-minutes: 5
        run: flutter test test/thai_playback_button_test.dart --reporter expanded

  android:
    name: Build and verify Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java for Android builds
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org=com.sharedbyatt --project-name=thai_for_myanmar

      - name: Apply safe Android defaults
        run: python3 tool/configure_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Restore Gradle dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Free unused runner toolchains for emulator space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Enable Linux hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available; emulator will use software acceleration."
          fi

      - name: Build Android review APK before emulator startup
        id: android_review_apk
        run: flutter build apk --debug

      - name: Preserve the review APK
        run: |
          mkdir -p build/review-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/review-artifacts/app-debug.apk

      - name: Build Android instrumentation test APK before emulator startup
        run: cd android && ./gradlew app:assembleAndroidTest

      - name: Build integration-test app before emulator startup
        id: android_integration_apk
        run: cd android && ./gradlew app:assembleDebug -Ptarget=integration_test/app_flow_test.dart

      - name: Stop Gradle daemons and free emulator resources
        if: steps.android_integration_apk.outcome == 'success'
        run: |
          ./android/gradlew --stop
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          df -h /
          free -h

      - name: Verify a core flow in an Android emulator
        id: android_core_flow
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: true
          script: bash tool/run_android_integration.sh

      - name: Build release-mode Android App Bundle
        run: flutter build appbundle --release

      - name: Keep Android review builds
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-android-builds
          path: |
            build/review-artifacts/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Capture Android emulator diagnostics after failure
        if: failure() && steps.android_core_flow.outcome == 'failure'
        timeout-minutes: 2
        run: |
          mkdir -p ci-diagnostics
          timeout 15s adb devices -l > ci-diagnostics/adb-devices.txt 2>&1 || true
          if [ ! -s ci-diagnostics/android-logcat.txt ]; then
            timeout 20s adb -s emulator-5554 logcat -d -t 3000 > ci-diagnostics/android-logcat.txt 2>&1 || true
          fi
          free -h > ci-diagnostics/host-memory.txt 2>&1 || true
          df -h / > ci-diagnostics/host-disk.txt 2>&1 || true
          ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | head -20 > ci-diagnostics/host-processes.txt 2>&1 || true

      - name: Keep Android emulator diagnostics
        if: failure() && steps.android_core_flow.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-android-failure-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Save Gradle dependencies for the next run
        if: always() && steps.android_review_apk.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'pubspec.lock') }}

  web:
    name: Build and verify Web Preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform scaffolding
        run: flutter create . --platforms=web --org=com.sharedbyatt --project-name=thai_for_myanmar

      - name: Resolve packages
        run: flutter pub get

      - name: Install ChromeDriver
        run: |
          CHROME_BUILD="$(google-chrome --product-version | cut -d. -f1-3)"
          echo "Installing ChromeDriver matching Chrome $CHROME_BUILD"
          npx --yes @puppeteer/browsers install "chromedriver@$CHROME_BUILD"
          CHROMEDRIVER_BIN="$(find "$GITHUB_WORKSPACE/chromedriver" "$RUNNER_TEMP" "$HOME/.cache/puppeteer" -type f -name chromedriver -perm -u+x -print -quit 2>/dev/null)"
          if [ -z "$CHROMEDRIVER_BIN" ]; then
            echo "ChromeDriver installation did not produce an executable." >&2
            exit 1
          fi
          echo "$(dirname "$CHROMEDRIVER_BIN")" >> "$GITHUB_PATH"

      - name: Start ChromeDriver
        run: |
          chromedriver --verbose --log-path="$RUNNER_TEMP/chromedriver.log" --port=4444 > /dev/null 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chromedriver.log"
          exit 1

      - name: Verify core flows and responsive UI in mobile and desktop Chrome
        timeout-minutes: 16
        run: |
          for width in 390 1280; do
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_flow_test.dart \
              -d web-server \
              --web-browser-flag=--headless \
              --browser-dimension=${width}x900@1 || exit 1
          done

      - name: Keep mobile and desktop UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-ui-review
          path: build/ui-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Build release Web Preview
        run: flutter build web --release --base-href /

      - name: Keep verified Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Capture browser diagnostics after failure
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          cp "$RUNNER_TEMP/chromedriver.log" ci-diagnostics/chromedriver.log 2>/dev/null || true

      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thai-for-myanmar-web-failure-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
