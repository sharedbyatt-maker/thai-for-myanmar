name: thai_for_myanmar
description: Practical offline Thai for Myanmar speakers in Thailand.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  fsrs: 2.0.1
  audioplayers: ^6.8.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mobile_ads: ^7.0.0
  shared_preferences: ^2.5.3
  web: ^1.1.1
  supabase_flutter: 2.18.3
  app_links: 7.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - third_party/licenses/dart_fsrs_mit.txt
    - third_party/licenses/pouple_tim_mit.txt
    - assets/audio/thai/
    - assets/data/league_config.json
    - assets/data/phrase_categories.json
    - assets/data/phrases.json
    - assets/data/thai_audio_manifest.json
    - assets/data/course_v2.json
    - assets/data/course_audio_manifest.json
